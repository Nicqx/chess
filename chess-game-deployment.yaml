apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-game-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: chess-game
  template:
    metadata:
      labels:
        app: chess-game
    spec:
      containers:
      - name: chess-game
        image: chess-game:1.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8099
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: REDIS_KEY_PREFIX
          value: "chess:session"
        - name: SESSION_TIMEOUT
          value: "10800"
        - name: PORT
          value: "8099"
        - name: BASE_PATH
          value: "/chess"
        - name: STOCKFISH_PATH
          value: "/usr/games/stockfish"
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 160Mi
          limits:
            cpu: 700m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chess-game-service
spec:
  type: ClusterIP
  selector:
    app: chess-game
  ports:
  - name: http
    protocol: TCP
    port: 8099
    targetPort: http
